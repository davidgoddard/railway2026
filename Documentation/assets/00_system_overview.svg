<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Camera-based railway occupancy system overview</title>
  <desc id="desc">Camera modules process images locally and send occupancy states over ESP-NOW to a bridge controller. The bridge publishes states over Wi-Fi and MQTT to railway control software. A setup application connects to the bridge by USB.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1824"/>
      <stop offset="1" stop-color="#132a3a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#050b10" flood-opacity=".34"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#52d8b5"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#background)"/>
  <text x="54" y="62" fill="#eaf3f7" font-family="system-ui, sans-serif" font-size="29" font-weight="700">How the system connects</text>
  <text x="54" y="92" fill="#8fa8b8" font-family="system-ui, sans-serif" font-size="17">Images stay at the camera; compact occupancy states travel to the layout software.</text>

  <g filter="url(#shadow)" font-family="system-ui, sans-serif">
    <g transform="translate(52 142)">
      <rect width="300" height="220" rx="22" fill="#182d3c" stroke="#315064" stroke-width="2"/>
      <rect x="30" y="34" width="74" height="56" rx="10" fill="#263f50" stroke="#54dab8" stroke-width="3"/>
      <circle cx="67" cy="62" r="17" fill="#0d1821" stroke="#54dab8" stroke-width="4"/>
      <path d="M118 48h16v28h-16M42 106h50" fill="none" stroke="#7390a2" stroke-width="5" stroke-linecap="round"/>
      <text x="30" y="138" fill="#eaf3f7" font-size="23" font-weight="700">Camera modules</text>
      <text x="30" y="170" fill="#a8bbc7" font-size="17">Local image processing</text>
      <text x="30" y="197" fill="#7894a5" font-size="15">Only sensor states leave the camera</text>
    </g>

    <g transform="translate(450 142)">
      <rect width="300" height="220" rx="22" fill="#193347" stroke="#43cbaa" stroke-width="2"/>
      <rect x="30" y="31" width="75" height="65" rx="10" fill="#10222f" stroke="#54dab8" stroke-width="3"/>
      <g fill="#54dab8"><circle cx="50" cy="50" r="4"/><circle cx="67" cy="50" r="4"/><circle cx="84" cy="50" r="4"/><rect x="49" y="66" width="37" height="11" rx="3"/></g>
      <path d="M112 61q23-22 46 0M121 71q14-13 28 0M129 80q6-6 12 0" fill="none" stroke="#56c9ef" stroke-width="4" stroke-linecap="round"/>
      <circle cx="135" cy="89" r="4" fill="#56c9ef"/>
      <text x="30" y="138" fill="#eaf3f7" font-size="23" font-weight="700">Bridge controller</text>
      <text x="30" y="170" fill="#a8bbc7" font-size="17">Wi-Fi-capable ESP32</text>
      <text x="30" y="197" fill="#7894a5" font-size="15">ESP-NOW ↔ MQTT gateway</text>
    </g>

    <g transform="translate(848 142)">
      <rect width="300" height="220" rx="22" fill="#182d3c" stroke="#315064" stroke-width="2"/>
      <rect x="30" y="34" width="94" height="62" rx="8" fill="#10222f" stroke="#56c9ef" stroke-width="3"/>
      <path d="M40 80l19-17 15 9 19-23 21 11" fill="none" stroke="#54dab8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M61 106h32M77 96v10" stroke="#7390a2" stroke-width="5" stroke-linecap="round"/>
      <text x="30" y="138" fill="#eaf3f7" font-size="23" font-weight="700">Railway control</text>
      <text x="30" y="170" fill="#a8bbc7" font-size="17">MQTT broker and clients</text>
      <text x="30" y="197" fill="#7894a5" font-size="15">JMRI or other layout software</text>
    </g>
  </g>

  <g fill="none" stroke="#52d8b5" stroke-width="4" marker-end="url(#arrow)">
    <path d="M368 252h64"/>
    <path d="M766 252h64"/>
    <path d="M600 453v-71"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="400" y="229" fill="#54dab8" font-size="16" font-weight="700">ESP-NOW</text>
    <text x="798" y="229" fill="#54dab8" font-size="16" font-weight="700">Wi-Fi · MQTT</text>
    <text x="633" y="422" fill="#54dab8" font-size="16" font-weight="700">USB</text>
  </g>

  <g transform="translate(450 450)" font-family="system-ui, sans-serif">
    <rect width="300" height="70" rx="18" fill="#203648" stroke="#47677b" stroke-width="2"/>
    <rect x="24" y="18" width="50" height="34" rx="5" fill="#10222f" stroke="#c59cff" stroke-width="2"/>
    <circle cx="49" cy="35" r="5" fill="#c59cff"/>
    <text x="92" y="31" fill="#eaf3f7" font-size="19" font-weight="700">Setup application</text>
    <text x="92" y="53" fill="#95abba" font-size="14">Web browser or desktop app</text>
  </g>
</svg>
