<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Rail and sleeper direction-family selection</title><desc id="desc">The dominant rail direction is selected first. A dedicated search then looks within fifteen degrees of the perpendicular for weaker sleeper edges before generic secondary directions are considered.</desc>
  <rect width="1100" height="430" rx="24" fill="#0f1e2c"/><text x="42" y="55" fill="#e8f1f6" font-family="sans-serif" font-size="26" font-weight="700">Railway-aware direction selection</text>
  <g transform="translate(58 95)"><rect width="350" height="270" rx="18" fill="#6e7371"/><g stroke="#3d332b" stroke-width="13"><path d="M40 70h270"/><path d="M40 135h270"/><path d="M40 200h270"/></g><g stroke="#d4d8d6" stroke-width="14"><path d="M125 15v240"/><path d="M230 15v240"/></g><path d="M177 28v214" stroke="#43dfb5" stroke-width="7"/><path d="M65 135h225" stroke="#ffd166" stroke-width="7"/><text x="19" y="259" fill="#e8f1f6" font-family="sans-serif" font-size="15">example sensor crop</text></g>
  <g font-family="sans-serif"><circle cx="570" cy="175" r="87" fill="#172c3b" stroke="#36556a" stroke-width="2"/><path d="M570 100v150" stroke="#43dfb5" stroke-width="7"/><path d="M495 175h150" stroke="#ffd166" stroke-width="7"/><path d="M570 175L630 120" stroke="#66899d" stroke-width="3"/><text x="690" y="122" fill="#43dfb5" font-size="19" font-weight="700">1. Dominant family</text><text x="690" y="154" fill="#9bb0bf" font-size="17">Strong rail or platform direction</text><text x="690" y="207" fill="#ffd166" font-size="19" font-weight="700">2. Perpendicular search</text><text x="690" y="239" fill="#9bb0bf" font-size="17">±15°, ≥4 samples, ≥3% support</text><text x="690" y="292" fill="#8ba5b5" font-size="19" font-weight="700">3. Generic secondary families</text><text x="690" y="324" fill="#9bb0bf" font-size="17">Normal separation and support rules</text><text x="465" y="390" fill="#9bb0bf" font-size="16">Displayed angles are physical line directions; gradient normals are rotated by 90°.</text></g>
</svg>
