<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Ten-second automatic sensor sizing</title><desc id="desc">Five nested fixed-centre sensor radii are tested from the same empty-track frames. The smallest stable radius with enough gradients is selected and returned to the bridge.</desc>
  <rect width="1100" height="430" rx="24" fill="#0f1e2c"/><text x="42" y="55" fill="#e8f1f6" font-family="sans-serif" font-size="26" font-weight="700">Empty-track auto-sizing: one shared 10-second run</text>
  <g transform="translate(55 95)"><rect width="360" height="270" rx="18" fill="#263746"/><path d="M25 210 L335 55 M30 238 L340 83" stroke="#b9c4c9" stroke-width="10"/><g stroke="#73543c" stroke-width="10"><path d="M80 224l-40-80"/><path d="M145 190l-40-80"/><path d="M210 156l-40-80"/><path d="M275 122l-40-80"/></g><g fill="none" stroke-width="3"><circle cx="180" cy="145" r="28" stroke="#54dab8"/><circle cx="180" cy="145" r="48" stroke="#56c9ef"/><circle cx="180" cy="145" r="69" stroke="#ffd166"/><circle cx="180" cy="145" r="91" stroke="#ff8fa3"/><circle cx="180" cy="145" r="113" stroke="#c59cff"/></g><circle cx="180" cy="145" r="4" fill="#fff"/></g>
  <g font-family="sans-serif"><text x="455" y="112" fill="#9bb0bf" font-size="18">Every available frame evaluates all sensors and all five radii.</text><text x="455" y="152" fill="#9bb0bf" font-size="18">A smaller radius qualifies only when:</text><text x="485" y="190" fill="#e8f1f6" font-size="18">• at least 100 strong gradients are present</text><text x="485" y="225" fill="#e8f1f6" font-size="18">• its worst empty score stays at or below 150/1000</text><text x="485" y="260" fill="#e8f1f6" font-size="18">• at least three live samples were obtained</text><path d="M455 292h570" stroke="#355064"/><text x="455" y="330" fill="#54dab8" font-size="19" font-weight="700">Result → smallest qualifying radius</text><text x="455" y="363" fill="#9bb0bf" font-size="17">Otherwise the user’s maximum radius is retained. The bridge stores the chosen radius and conservative per-sensor threshold.</text></g>
</svg>
